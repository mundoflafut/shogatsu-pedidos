<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shogatsu">
<link rel="manifest" href="manifest-pedir-agora.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<title>Shogatsu — Peça Agora</title>
<style>
  :root{
    --bg:#0a0a0a; --card:#161616; --border:#2a2a2a;
    --gold:#c9a84c; --text:#f2f2f2; --muted:#9a9a9a; --whats:#3fae5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; justify-content:center; padding:32px 16px;
  }
  .wrap{width:100%; max-width:420px; text-align:center;}
  .logo{font-size:52px; margin-bottom:6px;}
  h1{font-size:20px; margin:0 0 4px; color:var(--gold);}
  .sub{font-size:13px; color:var(--muted); margin-bottom:28px;}

  .link{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:12px; text-decoration:none; color:var(--text);
    transition:transform .1s, border-color .15s;
  }
  .link:active{transform:scale(.98);}
  .link.primary{background:var(--gold); color:#1a1400; border-color:var(--gold);}
  .link .ico{font-size:24px; flex-shrink:0;}
  .link .txt{text-align:left; flex:1;}
  .link .txt b{display:block; font-size:15px;}
  .link .txt span{display:block; font-size:11px; opacity:.75; margin-top:2px;}
  .link.primary .txt span{opacity:.6;}
  .link .arrow{font-size:16px; opacity:.5;}

  footer{margin-top:28px; font-size:11px; color:var(--muted);}
  footer a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🍣</div>
  <h1 id="store-name">Shogatsu Culinária Oriental</h1>
  <div class="sub">Escolha uma opção abaixo</div>

  <a class="link primary" href="/">
    <span class="ico">🛵</span>
    <span class="txt"><b>Fazer Pedido — Delivery/Retirada</b><span>Cardápio completo, entrega na sua casa</span></span>
    <span class="arrow">›</span>
  </a>

  <a class="link" href="/cardapio-rodizio.html">
    <span class="ico">🍽️</span>
    <span class="txt"><b>Cardápio do Rodízio</b><span>Pra quem já está na loja</span></span>
    <span class="arrow">›</span>
  </a>

  <a class="link" id="whats-link" href="#" target="_blank" rel="noopener">
    <span class="ico">💬</span>
    <span class="txt"><b>Falar no WhatsApp</b><span>Dúvidas, reservas, atendimento</span></span>
    <span class="arrow">›</span>
  </a>

  <a class="link" id="maps-link" href="#" target="_blank" rel="noopener" style="display:none;">
    <span class="ico">📍</span>
    <span class="txt"><b>Como Chegar</b><span>Ver no mapa</span></span>
    <span class="arrow">›</span>
  </a>

  <footer id="footer-note">Shogatsu Culinária Oriental</footer>
</div>

<script>
// v33: link único pra colocar na bio do Instagram/Facebook. Busca os dados reais da loja
// (nome, whatsapp, endereço) no /api/config, então fica sempre sincronizado — se o número
// do whatsapp mudar no painel, essa página já atualiza sozinha, sem precisar editar nada aqui.
(async function(){
  try {
    const r = await fetch('/api/config');
    const data = await r.json();
    const cfg = data.cfg || {};
    if (cfg.name) document.getElementById('store-name').textContent = cfg.name;
    document.getElementById('footer-note').textContent = cfg.name || 'Shogatsu Culinária Oriental';

    const whatsDigits = (cfg.whats || cfg.storePhone || '').replace(/\D/g, '');
    const whatsLink = document.getElementById('whats-link');
    if (whatsDigits) {
      whatsLink.href = 'https://wa.me/' + (whatsDigits.startsWith('55') ? whatsDigits : '55' + whatsDigits);
    } else {
      whatsLink.style.display = 'none';
    }

    if (cfg.storeLat && cfg.storeLng) {
      const mapsLink = document.getElementById('maps-link');
      mapsLink.href = `https://www.google.com/maps/search/?api=1&query=${cfg.storeLat},${cfg.storeLng}`;
      mapsLink.style.display = 'flex';
    }
  } catch (e) { /* mantém os textos padrão se a config não carregar */ }
})();

// v54: registra o service worker — deixa essa página instalável (PWA) também.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<link rel="stylesheet" href="/install-prompt.css">
<script src="/install-prompt.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shogatsu — Administração de Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  ============================================================================
  ADMIN DE CARDÁPIO — React (sem build step: React + Babel standalone via CDN)
  ============================================================================
  Esse arquivo roda direto no navegador, sem precisar de npm/webpack — só abrir
  a página. Os componentes abaixo (Sidebar, CategoryList, ProductArea,
  ProductCard, ItemModal) são componentes React "de verdade", reutilizáveis;
  se no futuro vocês migrarem pra um projeto React com build (Vite/Next), é só
  copiar o conteúdo do <script type="text/babel"> pra arquivos .jsx.

  CONECTAR COM BANCO DE DADOS DEPOIS:
  Toda a leitura/escrita de dados passa pelas funções marcadas com
  "// TODO API:" — hoje elas leem/escrevem no estado local (mock). Pra plugar
  no back-end de verdade, troque o corpo dessas funções por chamadas a
  fetch('/api/menu', ...) (esse projeto já tem endpoints de cardápio em
  server.js — GET/POST de cfg.menu) e mantenha a mesma assinatura.
  ============================================================================
-->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0f0f0f; --sidebar:#141414; --panel:#1a1a1a; --card:#202020;
    --card-hover:#252525; --border:#2a2a2a; --border2:#333;
    --red:#c0392b; --red-lt:#e05a4a; --red-bg:rgba(192,57,43,.12);
    --green:#27ae60; --green-lt:#2ecc71; --green-bg:rgba(39,174,96,.12);
    --gold:#c9a84c; --gold-lt:#ddc179; --gold-bg:rgba(201,168,76,.12);
    --white:#f0f0f0; --muted:#8a8a8a; --muted2:#555;
    --sidebar-w:220px; --cats-w:300px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body,#root{height:100%;}
  body{
    background:var(--bg); color:var(--white); font-family:'Inter',sans-serif;
    font-size:14px; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex; height:100vh; width:100vw;}

  /* ───────── SIDEBAR ───────── */
  .sidebar{
    width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--sidebar);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    padding:20px 14px; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
  .brand-icon{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--gold),#8a6d2c);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 auto;
  }
  .brand-name{font-weight:800; font-size:15px; letter-spacing:.2px;}
  .brand-sub{font-size:10.5px; color:var(--muted); margin-top:1px;}
  .nav-list{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    color:var(--muted); background:transparent; border:none; font-size:13px; font-weight:600;
    text-align:left; width:100%; transition:.14s;
  }
  .nav-item:hover{background:var(--panel); color:var(--white);}
  .nav-item.active{background:var(--gold-bg); color:var(--gold-lt);}
  .nav-item .ni-icon{font-size:16px; width:20px; text-align:center;}
  .sidebar-foot{margin-top:auto; padding:14px 10px 4px; font-size:10.5px; color:var(--muted2); border-top:1px solid var(--border); margin-top:16px;}

  /* ───────── MAIN LAYOUT ───────── */
  .main{flex:1; display:flex; min-width:0; height:100vh;}

  /* ───────── CATEGORY COLUMN ───────── */
  .cats-col{
    width:var(--cats-w); flex:0 0 var(--cats-w); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; background:var(--bg);
  }
  .cats-head{padding:20px 18px 14px; border-bottom:1px solid var(--border); flex:0 0 auto;}
  .cats-head h2{font-size:16px; font-weight:800;}
  .cats-head p{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .cats-list{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:0;}
  .cat-item{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px;
    display:flex; align-items:center; gap:10px; cursor:pointer; transition:.14s;
  }
  .cat-item:hover{border-color:var(--border2);}
  .cat-item.active{border-color:var(--gold); background:var(--gold-bg);}
  .cat-item .ci-icon{
    width:36px; height:36px; flex:0 0 36px; border-radius:9px; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .cat-item.active .ci-icon{background:var(--gold); }
  .cat-item .ci-body{flex:1; min-width:0;}
  .cat-item .ci-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat-item .ci-count{font-size:11px; color:var(--muted); margin-top:1px;}
  .cat-item .ci-actions{display:flex; flex-direction:column; gap:3px; flex:0 0 auto;}
  .ci-reorder-btn{
    width:22px; height:18px; border:1px solid var(--border2); background:var(--card); color:var(--muted);
    border-radius:5px; font-size:10px; display:flex; align-items:center; justify-content:center;
  }
  .ci-reorder-btn:hover{color:var(--white); border-color:var(--gold);}
  .ci-edit-btn{
    flex:0 0 auto; width:28px; height:28px; border-radius:7px; border:1px solid var(--border2);
    background:var(--card); color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .ci-edit-btn:hover{color:var(--gold); border-color:var(--gold);}
  .cats-add{padding:12px; border-top:1px solid var(--border); flex:0 0 auto;}
  .btn-add-cat{
    width:100%; padding:10px; border-radius:9px; border:1px dashed var(--border2); background:transparent;
    color:var(--muted); font-size:12.5px; font-weight:600;
  }
  .btn-add-cat:hover{border-color:var(--gold); color:var(--gold);}

  /* ───────── PRODUCTS AREA ───────── */
  .products-col{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;}
  .products-head{
    padding:20px 26px 16px; border-bottom:1px solid var(--border); flex:0 0 auto;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:space-between;
  }
  .ph-title{display:flex; align-items:center; gap:12px; min-width:0;}
  .ph-title .icon{font-size:26px;}
  .ph-title h1{font-size:19px; font-weight:800;}
  .ph-title .count-tag{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ph-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{position:relative;}
  .search-box input{
    background:var(--panel); border:1px solid var(--border2); border-radius:9px; padding:9px 12px 9px 32px;
    color:var(--white); font-size:12.5px; width:220px; outline:none;
  }
  .search-box input:focus{border-color:var(--gold);}
  .search-box .si{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted);}
  .btn{
    padding:10px 16px; border-radius:9px; border:1px solid transparent; font-size:12.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn.primary{background:var(--gold); color:#1a1405;}
  .btn.primary:hover{background:var(--gold-lt);}
  .btn.ghost{background:var(--panel); border-color:var(--border2); color:var(--white);}
  .btn.ghost:hover{border-color:var(--gold);}

  .products-body{flex:1; overflow-y:auto; padding:20px 26px 40px; min-height:0;}
  .products-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px;}
  .empty-state{text-align:center; padding:70px 20px; color:var(--muted);}
  .empty-state .es-icon{font-size:38px; margin-bottom:10px;}

  .p-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;
    display:flex; gap:12px; transition:.14s;
  }
  .p-card:hover{border-color:var(--border2); background:var(--card-hover);}
  .p-card .p-img{
    width:64px; height:64px; flex:0 0 64px; border-radius:10px; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden;
  }
  .p-card .p-img img{width:100%; height:100%; object-fit:cover;}
  .p-card .p-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .p-card .p-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .p-card .p-name{font-size:13.5px; font-weight:700; line-height:1.3;}
  .p-card .p-desc{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .p-card .p-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px;}
  .p-card .p-price{font-size:14.5px; font-weight:800; color:var(--gold-lt);}
  .p-status{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .p-status.available{color:var(--green-lt); background:var(--green-bg);}
  .p-status.unavailable{color:var(--red-lt); background:var(--red-bg);}
  .p-card .p-actions{display:flex; gap:6px; flex:0 0 auto;}
  .p-action-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border2); background:var(--card);
    color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .p-action-btn:hover{color:var(--white); border-color:var(--gold);}
  .p-action-btn.danger:hover{color:var(--red-lt); border-color:var(--red);}

  /* ───────── MODAL ───────── */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border2); border-radius:16px; width:100%; max-width:440px;
    max-height:88vh; display:flex; flex-direction:column;
  }
  .modal-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{font-size:15px; font-weight:800;}
  .modal-close{background:none; border:none; color:var(--muted); font-size:18px;}
  .modal-body{padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:13px;}
  .field label{display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--card); border:1px solid var(--border2); border-radius:8px; padding:9px 11px;
    color:var(--white); font-size:13px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--gold);}
  .field textarea{min-height:64px; resize:vertical;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border2); border-radius:8px; padding:10px 12px;}
  .toggle-row span{font-size:12.5px; font-weight:600;}
  .modal-foot{padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}

  /* ───────── RESPONSIVE (tablet) ───────── */
  @media (max-width:1000px){
    :root{--sidebar-w:76px; --cats-w:230px;}
    .brand-name,.brand-sub,.nav-item span:not(.ni-icon),.sidebar-foot{display:none;}
    .brand{justify-content:center; padding-bottom:16px;}
    .nav-item{justify-content:center; padding:12px;}
    .ph-actions{width:100%; justify-content:space-between;}
    .search-box input{width:100%;}
  }
  @media (max-width:680px){
    .cats-col{width:100%; flex:0 0 auto; max-width:100%;}
    .main{flex-direction:column;}
    .products-col{min-height:0;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ============================================================================
// DADOS MOCK — troque por dados vindos de GET /api/config (data.menu) quando
// for plugar no banco de verdade. O formato abaixo já é compatível com o
// cardápio usado no resto do site (icon, title, items[]).
// ============================================================================
const MOCK_CATEGORIES = [
  { id: 'rodizio-master', icon: '🍱', title: 'Rodízio Master', items: [
    { id: 'i1', name: 'Sushi Salmão', desc: 'Arroz temperado, salmão fresco fatiado na hora.', price: 0, image: '', available: true },
    { id: 'i2', name: 'Sashimi de Atum', desc: 'Cortes selecionados de atum fresco.', price: 0, image: '', available: true },
  ]},
  { id: 'combos', icon: '🍣', title: 'Combos Tradicionais', items: [
    { id: 'i3', name: 'Combo 20 peças', desc: 'Mix de sushis, sashimis e uramakis.', price: 79.9, image: '', available: true },
    { id: 'i4', name: 'Combo 30 peças', desc: 'Mix generoso pra 2 pessoas.', price: 109.9, image: '', available: false },
  ]},
  { id: 'promocoes', icon: '🎟️', title: 'Promoções Exclusivas', items: [
    { id: 'i5', name: 'Terça do Temaki', desc: 'Todo temaki com 15% OFF às terças.', price: 32.9, image: '', available: true },
  ]},
  { id: 'temakis', icon: '🥢', title: 'Temakis', items: [
    { id: 'i6', name: 'Temaki Filadélfia', desc: 'Salmão, cream cheese, cebolinha.', price: 28.5, image: '', available: true },
    { id: 'i7', name: 'Temaki Hot Filadélfia', desc: 'Empanado, salmão e cream cheese.', price: 31.0, image: '', available: true },
  ]},
  { id: 'sashimis', icon: '🍥', title: 'Sashimis', items: [
    { id: 'i8', name: 'Sashimi Salmão (10un)', desc: 'Cortes generosos de salmão fresco.', price: 45.0, image: '', available: true },
  ]},
  { id: 'sushi', icon: '🍣', title: 'Sushi', items: [
    { id: 'i9', name: 'Niguiri Salmão (2un)', desc: 'Arroz moldado com fatia de salmão.', price: 12.0, image: '', available: true },
  ]},
  { id: 'harumakis', icon: '🥟', title: 'Harumakis', items: [
    { id: 'i10', name: 'Harumaki de Camarão', desc: 'Massa crocante recheada com camarão.', price: 22.0, image: '', available: true },
    { id: 'i11', name: 'Harumaki de Legumes', desc: 'Recheio de legumes frescos salteados.', price: 18.0, image: '', available: true },
  ]},
];

const NAV_ITEMS = [
  { key: 'pedidos', icon: '🧾', label: 'Pedidos' },
  { key: 'reservas', icon: '📅', label: 'Reservas' },
  { key: 'motoboys', icon: '🛵', label: 'Motoboys' },
  { key: 'cardapio', icon: '📖', label: 'Cardápio' },
  { key: 'qrcode', icon: '🔗', label: 'QR Code & Links' },
  { key: 'relatorios', icon: '📊', label: 'Relatórios' },
  { key: 'avaliacoes', icon: '⭐', label: 'Avaliações' },
  { key: 'config', icon: '⚙️', label: 'Configurações' },
];

function fmtPrice(v){
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}

function Sidebar({ active, onNavigate }) {
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="brand-icon">🍣</div>
        <div>
          <div className="brand-name">Shogatsu</div>
          <div className="brand-sub">Painel Admin</div>
        </div>
      </div>
      <nav className="nav-list">
        {NAV_ITEMS.map(n => (
          <button
            key={n.key}
            className={`nav-item ${active === n.key ? 'active' : ''}`}
            onClick={() => onNavigate(n.key)}
          >
            <span className="ni-icon">{n.icon}</span>
            <span>{n.label}</span>
          </button>
        ))}
      </nav>
      <div className="sidebar-foot">Shogatsu Culinária Oriental © {new Date().getFullYear()}</div>
    </aside>
  );
}

function CategoryColumn({ categories, activeCatId, onSelect, onReorder, onEditCategory, onAddCategory }) {
  return (
    <div className="cats-col">
      <div className="cats-head">
        <h2>Categorias</h2>
        <p>{categories.length} categorias no cardápio</p>
      </div>
      <div className="cats-list">
        {categories.map((cat, idx) => (
          <div
            key={cat.id}
            className={`cat-item ${cat.id === activeCatId ? 'active' : ''}`}
            onClick={() => onSelect(cat.id)}
          >
            <div className="ci-icon">{cat.icon}</div>
            <div className="ci-body">
              <div className="ci-name">{cat.title}</div>
              <div className="ci-count">{cat.items.length} {cat.items.length === 1 ? 'item' : 'itens'}</div>
            </div>
            <div className="ci-actions">
              <button
                type="button" className="ci-reorder-btn" title="Mover pra cima"
                disabled={idx === 0}
                style={idx === 0 ? { opacity: .3 } : null}
                onClick={(e) => { e.stopPropagation(); onReorder(cat.id, -1); }}
              >▲</button>
              <button
                type="button" className="ci-reorder-btn" title="Mover pra baixo"
                disabled={idx === categories.length - 1}
                style={idx === categories.length - 1 ? { opacity: .3 } : null}
                onClick={(e) => { e.stopPropagation(); onReorder(cat.id, 1); }}
              >▼</button>
            </div>
            <button
              type="button" className="ci-edit-btn" title="Editar categoria"
              onClick={(e) => { e.stopPropagation(); onEditCategory(cat); }}
            >✎</button>
          </div>
        ))}
      </div>
      <div className="cats-add">
        <button type="button" className="btn-add-cat" onClick={onAddCategory}>+ Nova Categoria</button>
      </div>
    </div>
  );
}

function ProductCard({ item, onEdit, onDelete }) {
  return (
    <div className="p-card">
      <div className="p-img">
        {item.image ? <img src={item.image} alt="" /> : '🍽️'}
      </div>
      <div className="p-body">
        <div className="p-top">
          <div className="p-name">{item.name}</div>
        </div>
        {item.desc ? <div className="p-desc">{item.desc}</div> : null}
        <div className="p-bottom">
          <div>
            <div className="p-price">{fmtPrice(item.price)}</div>
            <span className={`p-status ${item.available ? 'available' : 'unavailable'}`}>
              {item.available ? '✅ Disponível' : '⛔ Indisponível'}
            </span>
          </div>
          <div className="p-actions">
            <button type="button" className="p-action-btn" title="Editar" onClick={() => onEdit(item)}>✎</button>
            <button type="button" className="p-action-btn danger" title="Excluir" onClick={() => onDelete(item)}>🗑</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProductsColumn({ category, search, onSearch, onNewItem, onEditItem, onDeleteItem }) {
  const items = useMemo(() => {
    if (!category) return [];
    const q = search.trim().toLowerCase();
    if (!q) return category.items;
    return category.items.filter(it => it.name.toLowerCase().includes(q) || (it.desc || '').toLowerCase().includes(q));
  }, [category, search]);

  if (!category) {
    return (
      <div className="products-col">
        <div className="empty-state" style={{ margin: 'auto' }}>
          <div className="es-icon">📖</div>
          <div>Selecione uma categoria à esquerda pra ver os itens.</div>
        </div>
      </div>
    );
  }

  return (
    <div className="products-col">
      <div className="products-head">
        <div className="ph-title">
          <span className="icon">{category.icon}</span>
          <div>
            <h1>{category.title}</h1>
            <div className="count-tag">{category.items.length} {category.items.length === 1 ? 'item cadastrado' : 'itens cadastrados'}</div>
          </div>
        </div>
        <div className="ph-actions">
          <div className="search-box">
            <span className="si">🔍</span>
            <input
              type="text" placeholder="Buscar produto..."
              value={search} onChange={e => onSearch(e.target.value)}
            />
          </div>
          <button type="button" className="btn primary" onClick={onNewItem}>+ Novo Item</button>
        </div>
      </div>
      <div className="products-body">
        {items.length === 0 ? (
          <div className="empty-state">
            <div className="es-icon">🔎</div>
            <div>Nenhum produto encontrado{search ? ` pra "${search}"` : ' nessa categoria ainda'}.</div>
          </div>
        ) : (
          <div className="products-grid">
            {items.map(it => (
              <ProductCard key={it.id} item={it} onEdit={onEditItem} onDelete={onDeleteItem} />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ItemModal({ item, onSave, onClose }) {
  const isNew = !item || !item.id;
  const [form, setForm] = useState({
    name: item?.name || '', desc: item?.desc || '',
    price: item?.price ?? '', image: item?.image || '',
    available: item?.available !== false,
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3>{isNew ? '+ Novo Item' : 'Editar Item'}</h3>
          <button type="button" className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Nome do produto</label>
            <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Ex: Temaki Filadélfia" />
          </div>
          <div className="field">
            <label>Descrição</label>
            <textarea value={form.desc} onChange={e => set('desc', e.target.value)} placeholder="Ingredientes, modo de preparo..." />
          </div>
          <div className="field-row">
            <div className="field">
              <label>Preço (R$)</label>
              <input type="number" min="0" step="0.01" value={form.price} onChange={e => set('price', e.target.value)} placeholder="0,00" />
            </div>
            <div className="field">
              <label>URL da imagem</label>
              <input value={form.image} onChange={e => set('image', e.target.value)} placeholder="https://..." />
            </div>
          </div>
          <div className="toggle-row">
            <span>Disponível no cardápio</span>
            <input type="checkbox" checked={form.available} onChange={e => set('available', e.target.checked)} style={{ width: 18, height: 18 }} />
          </div>
        </div>
        <div className="modal-foot">
          <button type="button" className="btn ghost" onClick={onClose}>Cancelar</button>
          <button
            type="button" className="btn primary"
            onClick={() => onSave({ ...item, ...form, price: Number(form.price) || 0 })}
          >Salvar</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeNav, setActiveNav] = useState('cardapio');
  const [categories, setCategories] = useState(MOCK_CATEGORIES);
  const [activeCatId, setActiveCatId] = useState(MOCK_CATEGORIES[0].id);
  const [search, setSearch] = useState('');
  const [editingItem, setEditingItem] = useState(null); // {..item} ou {} pra novo
  const [modalOpen, setModalOpen] = useState(false);

  const activeCategory = categories.find(c => c.id === activeCatId) || null;

  // TODO API: carregar cardápio real ao montar a página.
  // useEffect(() => {
  //   fetch('/api/config').then(r => r.json()).then(data => {
  //     setCategories(data.menu.map(normalizeCategoryFromServer)));
  //   });
  // }, []);

  function handleReorder(catId, dir) {
    setCategories(prev => {
      const idx = prev.findIndex(c => c.id === catId);
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= prev.length) return prev;
      const next = [...prev];
      [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
      // TODO API: persistir a nova ordem — POST /api/config com o menu reordenado.
      return next;
    });
  }

  function handleAddCategory() {
    const title = prompt('Nome da nova categoria:');
    if (!title || !title.trim()) return;
    const newCat = { id: 'cat-' + Date.now(), icon: '🍽️', title: title.trim(), items: [] };
    setCategories(prev => [...prev, newCat]);
    setActiveCatId(newCat.id);
    // TODO API: POST /api/config incluindo a nova categoria no menu.
  }

  function handleEditCategory(cat) {
    const title = prompt('Renomear categoria:', cat.title);
    if (!title || !title.trim()) return;
    setCategories(prev => prev.map(c => c.id === cat.id ? { ...c, title: title.trim() } : c));
    // TODO API: POST /api/config com o título atualizado.
  }

  function handleNewItem() {
    setEditingItem({});
    setModalOpen(true);
  }
  function handleEditItem(item) {
    setEditingItem(item);
    setModalOpen(true);
  }
  function handleDeleteItem(item) {
    if (!confirm(`Excluir "${item.name}"? Essa ação não pode ser desfeita.`)) return;
    setCategories(prev => prev.map(c => c.id !== activeCatId ? c : {
      ...c, items: c.items.filter(it => it.id !== item.id)
    }));
    // TODO API: DELETE do item — POST /api/config com o item removido do menu.
  }
  function handleSaveItem(form) {
    setCategories(prev => prev.map(c => {
      if (c.id !== activeCatId) return c;
      if (form.id) {
        return { ...c, items: c.items.map(it => it.id === form.id ? { ...it, ...form } : it) };
      }
      return { ...c, items: [...c.items, { ...form, id: 'item-' + Date.now() }] };
    }));
    // TODO API: POST /api/config com o item novo/atualizado no menu.
    setModalOpen(false);
    setEditingItem(null);
  }

  return (
    <div className="app">
      <Sidebar active={activeNav} onNavigate={setActiveNav} />
      <div className="main">
        <CategoryColumn
          categories={categories}
          activeCatId={activeCatId}
          onSelect={(id) => { setActiveCatId(id); setSearch(''); }}
          onReorder={handleReorder}
          onEditCategory={handleEditCategory}
          onAddCategory={handleAddCategory}
        />
        <ProductsColumn
          category={activeCategory}
          search={search}
          onSearch={setSearch}
          onNewItem={handleNewItem}
          onEditItem={handleEditItem}
          onDeleteItem={handleDeleteItem}
        />
      </div>
      {modalOpen && (
        <ItemModal
          item={editingItem}
          onSave={handleSaveItem}
          onClose={() => { setModalOpen(false); setEditingItem(null); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

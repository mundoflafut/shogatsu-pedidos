<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rastreio Shogatsu">
<link rel="manifest" href="manifest-entregador.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<title>Rastreio da Entrega</title>
<style>
  :root{
    --bg:#0a0a0a; --card:#161616; --border:#2a2a2a;
    --gold:#c9a84c; --gold-dk:#8a7133;
    --text:#f2f2f2; --muted:#9a9a9a;
    --green:#3fae5c; --red:#d3443f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:24px; text-align:center;
  }
  .logo{font-size:34px; margin-bottom:6px;}
  h1{font-size:18px; margin:0 0 4px; color:var(--gold);}
  .sub{font-size:12px; color:var(--muted); margin-bottom:18px;}
  .info{
    text-align:left; background:#0f0f0f; border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-bottom:18px; font-size:14px; line-height:1.5;
  }
  .info b{color:var(--gold);}
  .info a{color:var(--text);}
  .btn{
    width:100%; padding:16px; border:none; border-radius:10px; font-size:15px; font-weight:700;
    cursor:pointer; transition:opacity .15s;
  }
  .btn:active{opacity:.8;}
  .btn-primary{background:var(--gold); color:#1a1400;}
  .btn-primary:disabled{background:#3a3a3a; color:#777; cursor:default;}
  .status-box{
    display:none; align-items:center; gap:10px; justify-content:center;
    background:rgba(63,174,92,.12); border:1px solid var(--green); border-radius:10px;
    padding:12px; font-size:13px; margin-top:14px; color:var(--green);
  }
  .status-box.show{display:flex;}
  .dot{
    width:10px; height:10px; border-radius:50%; background:var(--green);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  .msg{font-size:14px; color:var(--muted); line-height:1.6;}
  .msg.error{color:var(--red);}
  .last-sent{font-size:11px; color:var(--muted); margin-top:8px;}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="logo">🛵</div>
  <h1>Rastreio da Entrega</h1>
  <div class="sub">Carregando pedido...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const orderId = params.get('id');
const app = document.getElementById('app');
let watchId = null;
let lastSentAt = 0;
const SEND_INTERVAL_MS = 8000; // não manda a cada milissegundo do watchPosition — só a cada ~8s
let statusPollTimer = null;

function render(html){ app.innerHTML = html; }

function renderError(text){
  render(`
    <div class="logo">⚠️</div>
    <h1>Não foi possível abrir</h1>
    <div class="msg error">${text}</div>
  `);
}

function renderEnded(status){
  const texts = {
    entregue: ['✅', 'Entrega concluída', 'Essa entrega já foi finalizada — obrigado pelo trabalho!'],
    cancelado: ['🚫', 'Pedido cancelado', 'Essa entrega foi cancelada, não é mais necessário ir até lá.'],
  };
  const [icon, title, msg] = texts[status] || ['✅', 'Entrega encerrada', 'Esse link não está mais ativo.'];
  render(`<div class="logo">${icon}</div><h1>${title}</h1><div class="msg">${msg}</div>`);
}

function renderWaiting(){
  render(`
    <div class="logo">⏳</div>
    <h1>Aguardando o pedido ficar pronto</h1>
    <div class="msg">Assim que a loja marcar o pedido como "saiu para entrega", esta página libera o compartilhamento de localização. Pode deixar aberta.</div>
  `);
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderReady(order){
  render(`
    <div class="logo">🛵</div>
    <h1>Pedido ${order.ticketNumber ? '#' + esc(order.ticketNumber) : ''}</h1>
    <div class="sub">${order.mode === 'delivery' ? 'Entrega' : 'Retirada'}</div>
    <div class="info">
      <div><b>Cliente:</b> ${esc(order.name || '—')}</div>
      ${order.phone ? `<div><b>Telefone:</b> <a href="tel:${esc(order.phone)}">${esc(order.phone)}</a></div>` : ''}
      ${order.address ? `<div><b>Endereço:</b> ${esc(order.address)}</div>` : ''}
      ${order.obs ? `<div><b>Obs:</b> ${esc(order.obs)}</div>` : ''}
    </div>
    <button class="btn btn-primary" id="btn-share">📍 Compartilhar minha localização</button>
    <div class="status-box" id="status-box"><div class="dot"></div><span>Compartilhando localização...</span></div>
    <div class="last-sent" id="last-sent"></div>
  `);
  document.getElementById('btn-share').addEventListener('click', startSharing);
}

async function fetchOrder(){
  try {
    const r = await fetch('/api/courier/order/' + encodeURIComponent(orderId));
    if (!r.ok) { renderError('Link inválido ou pedido não encontrado.'); return null; }
    return await r.json();
  } catch (e) {
    renderError('Sem conexão. Verifique a internet e recarregue a página.');
    return null;
  }
}

async function init(){
  if (!orderId) { renderError('Link incompleto — falta o código do pedido.'); return; }
  const data = await fetchOrder();
  if (!data) return;
  if (data.ended) { renderEnded(data.status); return; }
  if (data.status === 'preparando') { renderWaiting(); startStatusPoll(); return; }
  renderReady(data);
  startStatusPoll();
}

// Fica de olho no status mesmo depois de já estar compartilhando — se a loja marcar
// como entregue/cancelado em outro lugar, essa página para sozinha, sem precisar recarregar.
function startStatusPoll(){
  if (statusPollTimer) clearInterval(statusPollTimer);
  statusPollTimer = setInterval(async () => {
    const data = await fetchOrder();
    if (!data) return;
    if (data.ended) {
      stopSharing();
      clearInterval(statusPollTimer);
      renderEnded(data.status);
    } else if (data.status === 'saiu' && document.getElementById('btn-share') === null && !document.getElementById('status-box')) {
      // status virou "saiu" enquanto a tela mostrava "aguardando" — atualiza a tela
      renderReady(data);
    }
  }, 15000);
}

function startSharing(){
  if (!navigator.geolocation) {
    showShareError('Este navegador não suporta compartilhar localização.');
    return;
  }
  const btn = document.getElementById('btn-share');
  const box = document.getElementById('status-box');
  btn.disabled = true;
  btn.textContent = '📍 Compartilhando...';
  box.classList.add('show');

  watchId = navigator.geolocation.watchPosition(
    pos => sendPosition(pos.coords.latitude, pos.coords.longitude),
    err => showShareError(err.code === 1
      ? 'Permissão de localização negada. Ative nas configurações do navegador pra continuar.'
      : 'Não consegui pegar sua localização agora. Verifique o GPS.'),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

function showShareError(text){
  const box = document.getElementById('status-box');
  if (box) { box.classList.remove('show'); }
  const lastSent = document.getElementById('last-sent');
  if (lastSent) { lastSent.textContent = '⚠️ ' + text; lastSent.style.color = 'var(--red)'; }
  const btn = document.getElementById('btn-share');
  if (btn) { btn.disabled = false; btn.textContent = '📍 Tentar novamente'; }
}

async function sendPosition(lat, lng){
  const now = Date.now();
  if (now - lastSentAt < SEND_INTERVAL_MS) return; // throttle — não manda toda hora
  lastSentAt = now;
  try {
    const r = await fetch('/api/courier/location/' + encodeURIComponent(orderId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng })
    });
    const data = await r.json();
    if (data.ended) { stopSharing(); renderEnded(data.status); return; }
    const lastSent = document.getElementById('last-sent');
    if (lastSent) { lastSent.style.color = ''; lastSent.textContent = 'Última atualização: ' + new Date().toLocaleTimeString('pt-BR'); }
  } catch (e) { /* próxima tentativa do watchPosition tenta de novo sozinha */ }
}

function stopSharing(){
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}

window.addEventListener('beforeunload', stopSharing);
init();

// v54: registra o service worker também aqui — deixa essa página instalável (PWA) e
// disponível offline/mais rápida, igual já acontecia em index.html/painel.html.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rodízio Popular — Shogatsu</title>
<meta property="og:title" content="Rodízio Popular — Shogatsu Culinária Oriental">
<meta property="og:description" content="Sushi à vontade, sabor sem limites. Terça, quarta, quinta, sexta, sábado e domingo.">
<meta name="theme-color" content="#0a0705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodízio Popular">
<link rel="manifest" href="manifest-divulgacao-rodizio.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0705; --gold:#e3bd6a; --gold-soft:#f3dca3; --gold-dk:#8a6d2c;
    --text:#f5f1ea; --muted:#b7ab97; --green:#3fae5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:radial-gradient(ellipse at top, #241a0d 0%, #0a0705 65%);
    color:var(--text); font-family:'Poppins',sans-serif;
    display:flex; justify-content:center; align-items:center; padding:28px 16px;
  }
  .wrap{width:100%; max-width:420px; text-align:center;}
  .logo{font-size:46px; margin-bottom:6px; filter:drop-shadow(0 2px 12px rgba(227,189,106,.35));}
  .brand{font-size:12px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:16px;}

  h1{
    font-family:'Playfair Display',serif; font-weight:800; font-size:34px; line-height:1.15; margin:0 0 6px;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold) 45%,#a9822f 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--gold);
  }
  .phrase{font-size:14px; font-style:italic; color:var(--gold-soft); margin-bottom:22px; min-height:20px;}

  .price-strip{display:flex; gap:10px; margin-bottom:16px;}
  .price-box{
    flex:1; background:#151109; border:1px solid var(--gold-dk); border-radius:16px; padding:14px 8px;
    box-shadow:0 12px 28px rgba(0,0,0,.35);
  }
  .price-box .d{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
  .price-box .p{font-size:21px; font-weight:700; color:var(--gold);}
  .price-box .m{font-size:9px; color:var(--muted);}

  .chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:26px;}
  .chip{
    font-size:11.5px; font-weight:600; background:linear-gradient(135deg,#3d3010,#241d05);
    border:1px solid var(--gold); border-radius:16px; padding:6px 12px;
  }

  .cta{
    display:block; width:100%; padding:17px; border-radius:14px; margin-bottom:12px;
    font-size:15px; font-weight:700; text-decoration:none; box-shadow:0 12px 28px rgba(0,0,0,.3);
  }
  .cta-primary{background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:#1a1400;}
  .cta-secondary{background:#151109; color:var(--text); border:1px solid #332a1f;}

  footer{margin-top:20px; font-size:11px; color:var(--muted); line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🍣</div>
  <div class="brand" id="brand">Shogatsu Culinária Oriental</div>
  <h1>Rodízio<br>Popular</h1>
  <div class="phrase" id="phrase-rotator"></div>

  <div class="price-strip" id="price-strip"></div>
  <div class="chips" id="chips"></div>

  <a class="cta cta-primary" href="/cardapio-rodizio-popular.html">📖 Ver Cardápio Completo</a>
  <a class="cta cta-secondary" id="whats-cta" href="#" target="_blank" rel="noopener">📅 Chamar no WhatsApp</a>

  <footer id="footer-addr"></footer>
</div>

<script>
// v33: página feita pra ser O link único de divulgação — cole ela na bio do Instagram/
// Facebook, no status do WhatsApp, ou mande direto pro cliente. Puxa telefone/endereço
// reais do /api/config (mesma fonte do resto do site). Preço e destaques ficam aqui embaixo
// — se mudar no cardapio-rodizio-popular.html, atualize aqui também pra manter igual.
const PROMO = {
  phrases: [
    "Sushi à vontade. Sabor sem limites.",
    "Aqui o rodízio é show — e o camarão é liberado.",
    "Temaki, sashimi, grelhados... e o refri é por nossa conta.",
  ],
  priceGroups: [
    { label: "Ter · Qua · Qui", cash: "R$ 59,99", card: "R$ 79,99" },
    { label: "Sex · Sáb · Dom", cash: "R$ 64,99", card: "R$ 84,99" },
  ],
  chips: ["🥤 Refri Liberado", "🥢 Temaki", "🍤 Camarão Alho e Óleo", "🍄 Shimeji"],
};

document.getElementById('price-strip').innerHTML = PROMO.priceGroups.map(g => `
  <div class="price-box">
    <div class="d">${g.label}</div>
    <div class="p">${g.cash}</div>
    <div class="m">dinheiro · ${g.card} cartão/pix</div>
  </div>
`).join('');

document.getElementById('chips').innerHTML = PROMO.chips.map(c => `<div class="chip">${c}</div>`).join('');

(function rotatePhrase(){
  const el = document.getElementById('phrase-rotator');
  let i = 0;
  function show(){ el.style.opacity = 0; setTimeout(() => { el.textContent = PROMO.phrases[i]; el.style.opacity = 1; }, 250); i = (i+1) % PROMO.phrases.length; }
  el.style.transition = 'opacity .4s';
  show();
  setInterval(show, 3800);
})();

(async function loadStoreInfo(){
  try {
    const r = await fetch('/api/config');
    const data = await r.json();
    const cfg = data.cfg || {};
    if (cfg.storeName) document.getElementById('brand').textContent = cfg.storeName;
    const whatsDigits = (cfg.whats || cfg.storePhone || '').replace(/\D/g, '');
    if (whatsDigits) {
      document.getElementById('whats-cta').href = 'https://wa.me/' + (whatsDigits.startsWith('55') ? whatsDigits : '55' + whatsDigits) + '?text=' + encodeURIComponent('Olá! Vi a divulgação do Rodízio Popular e quero saber mais 🍣');
    }
    document.getElementById('footer-addr').textContent = cfg.address || cfg.storeName || '';
  } catch (e) { /* mantém textos padrão */ }
})();

// v54: registra o service worker — deixa essa página instalável (PWA) também.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shogatsu · Painel do Restaurante</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0B0B0B;--panel:#111111;--card:#141414;--card-hover:#1D1D1D;--border:#242424;
  --red:#A30021;--red-lt:#e0344f;--red-dk:#6e0016;
  --gold:#D4AF37;--gold-dim:#8a7226;--cream:#f5ede0;--muted:#B8B8B8;--muted-dim:#777777;--white:#FFFFFF;
  --green:#32C36C;--green-lt:#4ddb85;--blue:#2980b9;--blue-lt:#3498db;
  --sidebar-w:280px;--sidebar-w-collapsed:70px;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:'Inter',sans-serif;}
input,select,textarea{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--black);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

/* ── Login ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#161616 0%,#0B0B0B 70%);}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 36px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.login-title{font-family:'Cinzel',serif;font-weight:600;font-size:24px;color:var(--gold);margin-bottom:26px;letter-spacing:3px;}
.login-input{width:100%;background:#111;border:1px solid var(--border);color:var(--white);font-size:18px;padding:14px;border-radius:10px;outline:none;text-align:center;letter-spacing:4px;margin-bottom:16px;transition:border-color .2s,box-shadow .2s;}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15);}
.login-btn{width:100%;background:var(--red);color:#fff;border:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:14px;border-radius:10px;height:48px;transition:all .2s;}
.login-btn:hover{background:var(--red-lt);box-shadow:0 0 20px rgba(163,0,33,.5);}
.login-err{color:var(--red-lt);font-size:12px;margin-top:10px;display:none;}

/* ── Layout: Sidebar + Topbar + Content ── */
#app{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid var(--border);white-space:nowrap;}
.sidebar-head .logo-dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
.sidebar-head .brand{font-family:'Cinzel',serif;font-size:16px;letter-spacing:1px;color:var(--white);overflow:hidden;}
.sidebar-head .brand small{display:block;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:2px;color:var(--muted-dim);text-transform:uppercase;margin-top:2px;}
.sidebar.collapsed .brand{display:none;}
.sidebar-toggle{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:28px;height:28px;flex:0 0 auto;font-size:13px;transition:all .2s;}
.sidebar-toggle:hover{border-color:var(--gold);color:var(--gold);}
.sidebar.collapsed .sidebar-toggle{margin-left:0;}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;white-space:nowrap;transition:all .15s;}
.nav-item .ic{font-size:16px;flex:0 0 20px;text-align:center;}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
.sidebar.collapsed .nav-item .label{display:none;}
.nav-item:hover{background:var(--card-hover);color:var(--white);}
.nav-item.active{background:rgba(212,175,55,.12);color:var(--white);}
.nav-item.active .ic{color:var(--gold);}
.nav-item.disabled{opacity:.35;cursor:not-allowed;}
.nav-item.disabled:hover{background:none;color:var(--muted);}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:299;}
.sidebar-overlay.show{display:block;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.main-area{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .25s ease;}
.main-area.collapsed{margin-left:var(--sidebar-w-collapsed);}
.topbar{background:rgba(17,17,17,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--white);border-radius:8px;width:38px;height:38px;font-size:16px;flex:0 0 auto;}
.topbar-title{font-family:'Cinzel',serif;font-size:17px;letter-spacing:1px;color:var(--white);}
.topbar-search{flex:1;max-width:340px;position:relative;display:none;}
.topbar-search input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--white);padding:9px 14px 9px 34px;border-radius:10px;font-size:12px;outline:none;transition:border-color .2s;}
.topbar-search input:focus{border-color:var(--gold);}
.topbar-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-dim);font-size:13px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;width:38px;height:38px;font-size:14px;position:relative;transition:all .15s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red-lt);}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--green-lt);display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--green-lt);}
.conn-dot.off{background:var(--red-lt);box-shadow:0 0 6px var(--red-lt);}
.conn-pill{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 12px;white-space:nowrap;}
.avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1a1400;flex:0 0 auto;}

.container{max-width:1200px;margin:0 auto;padding:24px;}

/* ── Cards genéricos ── */
.settings-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:border-color .2s,transform .2s;}
.settings-box:hover{border-color:#333;}
.admin-sec-title{font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:none;color:var(--white);margin:26px 0 12px;padding-bottom:0;border-bottom:none;display:flex;align-items:center;gap:8px;}
.admin-sec-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:inline-block;}
.admin-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.admin-field{flex:1;min-width:140px;}
.admin-field label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-dim);margin-bottom:6px;font-weight:600;}
.admin-field input,.admin-field textarea,.admin-field select{width:100%;background:#111111;border:1px solid var(--border);color:var(--white);font-size:13px;padding:11px 12px;border-radius:9px;outline:none;transition:border-color .15s,box-shadow .15s;}
.admin-field input::placeholder,.admin-field textarea::placeholder{color:var(--muted-dim);}
.admin-field input:focus,.admin-field textarea:focus,.admin-field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12);}
.admin-field textarea{resize:vertical;min-height:56px;}
.admin-item-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:border-color .2s;}
.admin-item-box:hover{border-color:#333;}
.btn-del{background:none;border:none;color:#665;font-size:12px;padding:2px 8px;transition:color .15s;}
.btn-del:hover{color:var(--red-lt);}
.btn-add-item{background:none;border:1px dashed var(--border);color:var(--muted);font-size:11px;letter-spacing:1.5px;padding:12px;width:100%;border-radius:10px;margin-top:4px;transition:all .15s;}
.btn-add-item:hover{border-color:var(--gold);color:var(--gold);}
.btn-save{background:var(--green);color:#fff;border:none;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:14px 28px;border-radius:12px;width:100%;margin-top:16px;height:48px;transition:all .2s;}
.btn-save:hover{background:var(--green-lt);box-shadow:0 0 20px rgba(50,195,108,.35);}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px;}
.photo-thumb{width:70px;height:70px;border:1px dashed var(--border);border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:border-color .15s;}
.photo-thumb:hover{border-color:var(--gold);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb span{font-size:9px;color:var(--muted);text-align:center;padding:4px;}

/* ── iOS Switch ── */
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:#3a3a3a;border-radius:20px;cursor:pointer;transition:background .25s;}
.switch-track::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.3);}
.switch input:checked + .switch-track{background:var(--green);}
.switch input:checked + .switch-track::before{transform:translateX(20px);}
.switch-row{display:flex;align-items:center;justify-content:space-between;background:#111;border:1px solid var(--border);border-radius:9px;padding:11px 14px;}
.switch-row .switch-label{font-size:13px;color:var(--white);}

/* ── Botões ── */
.btn-advance{background:var(--green);height:40px;border-radius:10px;transition:all .2s;}
.btn-advance:hover{background:var(--green-lt);box-shadow:0 0 16px rgba(50,195,108,.35);}
.btn-cancel{background:none;border:1px solid var(--red-dk)!important;color:var(--red-lt)!important;border-radius:10px;height:40px;transition:all .2s;}
.btn-cancel:hover{background:rgba(163,0,33,.15);box-shadow:0 0 16px rgba(163,0,33,.25);}
.btn-danger{background:var(--red);color:#fff;border:none;font-size:12px;letter-spacing:1px;padding:10px 18px;border-radius:10px;height:48px;transition:all .2s;}
.btn-danger:hover{background:var(--red-lt);box-shadow:0 0 20px rgba(163,0,33,.4);}

/* ── Kanban / Pedidos ── */
.order-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;}
.col-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.col-title .count{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:10px;}
.col-dropzone{min-height:60px;border-radius:var(--radius);transition:background .15s,box-shadow .15s;}
.col-dropzone.drag-over{background:rgba(212,175,55,.06);box-shadow:inset 0 0 0 2px var(--gold-dim);}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;animation:slideIn .3s;cursor:grab;transition:transform .15s,border-color .15s,box-shadow .15s;}
.order-card:hover{border-color:#333;transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35);}
.order-card.dragging{opacity:.4;}
.order-card.cancelled{border-color:var(--red-dk);opacity:.85;cursor:default;}
.cancel-warning{background:rgba(163,0,33,.15);border:1px solid var(--red-dk);color:var(--red-lt);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.order-card.new{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.order-id{font-family:'Cinzel',serif;font-weight:600;font-size:16px;color:var(--gold);}
.order-time{font-size:10px;color:var(--muted-dim);}
.order-mode{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);}
.order-customer{font-size:13px;margin-bottom:4px;}
.order-addr{font-size:11px;color:var(--muted);margin-bottom:8px;}
.order-items{font-size:12px;color:var(--white);margin-bottom:8px;line-height:1.6;}
.order-items span{color:var(--muted);}
.order-obs{font-size:11px;color:var(--gold);font-style:italic;margin-bottom:8px;}
.order-total{font-family:'Cinzel',serif;font-weight:600;font-size:17px;color:var(--red-lt);margin-bottom:10px;display:flex;justify-content:space-between;}
.order-pay{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.order-actions{display:flex;gap:6px;margin-top:10px;}
.order-actions button{flex:1;border:none;border-radius:10px;padding:8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.print-menu{position:relative;flex:0 0 auto;}
.print-menu summary{list-style:none;cursor:pointer;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 10px;font-size:13px;height:40px;display:flex;align-items:center;transition:all .15s;}
.print-menu summary::-webkit-details-marker{display:none;}
.print-menu[open] summary,.print-menu summary:hover{border-color:var(--gold);color:var(--gold);}
.print-menu-list{position:absolute;bottom:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:180px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.6);}
.print-menu-list button{background:none;border:none;color:var(--white);text-align:left;padding:9px 10px;border-radius:8px;font-size:12px;text-transform:none;letter-spacing:0;}
.print-menu-list button:hover{background:var(--card-hover);}
.print-menu-list .div{border-top:1px solid var(--border);margin:2px 0;}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--white);padding:12px 20px;border-radius:12px;font-size:13px;z-index:999;box-shadow:0 12px 30px rgba(0,0,0,.6);animation:toast-in .25s cubic-bezier(.2,.9,.3,1.3);}
.toast.error{border-color:var(--red-lt);}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
.item-unavailable{opacity:.5;}
.btn-avail{background:none!important;border:1px solid var(--green)!important;color:var(--green)!important;font-size:10px!important;padding:6px 10px!important;border-radius:20px!important;letter-spacing:0!important;text-transform:none!important;}
.btn-avail.off{border-color:var(--red-lt)!important;color:var(--red-lt)!important;}

/* ── Modais ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:400;animation:fadeIn .15s;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;width:340px;max-width:90vw;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:modalIn .2s cubic-bezier(.2,.9,.3,1.2);}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-title{font-family:'Cinzel',serif;font-size:15px;font-weight:600;color:var(--gold);margin-bottom:14px;}
.empty-col{color:var(--muted-dim);font-size:12px;font-style:italic;padding:12px 0;}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-state .ic{font-size:36px;margin-bottom:10px;opacity:.6;}
.empty-state .msg{font-size:13px;}

/* ── Skeleton ── */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Dashboard ── */
.dash-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.dash-metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:transform .2s,border-color .2s;}
.dash-metric:hover{transform:translateY(-2px);border-color:var(--gold-dim);}
.dash-metric .ic{font-size:18px;margin-bottom:8px;opacity:.85;}
.dash-metric .value{font-family:'Cinzel',serif;font-weight:600;font-size:26px;color:var(--gold);line-height:1.1;}
.dash-metric .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-dim);margin-top:6px;font-weight:600;}
.dash-charts{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.chart-card h4{font-size:12px;font-weight:600;color:var(--white);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.chart-card h4::before{content:'';width:3px;height:12px;background:var(--gold);border-radius:2px;}
@media (max-width:900px){.dash-charts{grid-template-columns:1fr;}}

.report-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;transition:transform .15s;}
.report-card:hover{transform:translateY(-2px);}
.report-card .value{font-family:'Cinzel',serif;font-weight:600;font-size:24px;color:var(--gold);}
.report-card .label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-dim);margin-top:4px;}
.report-table{width:100%;border-collapse:collapse;font-size:12px;}
.report-table th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-dim);padding:10px 8px;border-bottom:1px solid var(--border);}
.report-table td{padding:10px 8px;border-bottom:1px solid var(--border);}
.report-table tr:hover td{background:var(--card-hover);}
.danger-box{background:rgba(163,0,33,.08);border:1px solid var(--red-dk);border-radius:var(--radius);padding:18px;}

/* ── Mobile ── */
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;width:280px;}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:280px;}
  .sidebar.collapsed .brand,.sidebar.collapsed .nav-item .label{display:block;}
  .sidebar.collapsed .nav-item{justify-content:flex-start;padding:11px 12px;}
  .sidebar-toggle{display:none;}
  .main-area{margin-left:0;}
  .main-area.collapsed{margin-left:0;}
  .hamburger{display:flex;align-items:center;justify-content:center;}
  .topbar-search{display:none;}
  .topbar-title{font-size:15px;}
  .container{padding:16px;}
  .order-actions button{min-height:44px;}
  .icon-btn{width:40px;height:40px;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <p class="login-title">🍣 SHOGATSU</p>
    <input class="login-input" type="password" id="login-input" placeholder="senha" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <p class="login-err" id="login-err">Senha incorreta</p>
  </div>
</div>

<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarMobile()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-dot">🍣</div>
      <div class="brand">Shogatsu<small>Painel</small></div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Recolher menu">☰</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" id="tab-dashboard" onclick="switchTab('dashboard')"><span class="ic">📊</span><span class="label">Dashboard</span></button>
      <button class="nav-item active" id="tab-pedidos" onclick="switchTab('pedidos')"><span class="ic">📋</span><span class="label">Pedidos</span></button>
      <button class="nav-item" id="tab-config" onclick="switchTab('config')"><span class="ic">🍱</span><span class="label">Cardápio & Config</span></button>

<script>
function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function playDing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

let token = localStorage.getItem('shog_admin_token') || null;
let orders = [];
let cfg = {}, menu = [];
let currentTab = 'pedidos';
let es = null;

async function doLogin() {
  const password = document.getElementById('login-input').value;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const data = await r.json();
    if (r.ok) {
      token = data.token;
      localStorage.setItem('shog_admin_token', token);
      boot();
    } else {
      const err = document.getElementById('login-err');
      err.style.display = 'block'; setTimeout(() => err.style.display = 'none', 2000);
    }
  } catch (e) { alert('Erro de conexão com o servidor.'); }
}

async function boot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadOrders();
  await loadConfig();
  renderOrders();
  connectStream();
}

async function loadOrders() {
  const r = await fetch('/api/orders', { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) return logout();
  orders = await r.json();
}
async function loadConfig() {
  const r = await fetch('/api/config');
  const data = await r.json();
  cfg = data.cfg; menu = data.menu;
  applyUIFonts();
  renderConfig();
}
function applyUIFonts() {
  const f = cfg.uiFonts || {};
  const map = { pedidos: 'view-pedidos', config: 'view-config', clientes: 'view-clientes', relatorios: 'view-relatorios' };
  Object.entries(map).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if (el) el.style.fontSize = (f[key] || 13) + 'px';
  });
}
function logout() {
  token = null; localStorage.removeItem('shog_admin_token');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function connectStream() {
  if (es) es.close();
  es = new EventSource('/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { document.getElementById('conn-dot').classList.remove('off'); document.getElementById('conn-label').textContent = 'conectado'; };
  es.onerror = () => { document.getElementById('conn-dot').classList.add('off'); document.getElementById('conn-label').textContent = 'reconectando...'; };
  es.addEventListener('new-order', e => {
    const order = JSON.parse(e.data);
    orders.unshift(order);
    order._isNew = true;
    renderOrders();
    playDing();
    if (Notification && Notification.permission === 'granted') new Notification('Novo pedido #' + order.id);
  });
  es.addEventListener('order-updated', e => {
    const upd = JSON.parse(e.data);
    const i = orders.findIndex(o => o.id === upd.id);
    if (i > -1) orders[i] = upd;
    renderOrders();
  });
  es.addEventListener('config-updated', () => loadConfig());
}
if (window.Notification && Notification.permission === 'default') Notification.requestPermission();

const COLS = [
  { key: 'novo', label: '🆕 Novos', next: 'preparando', nextLabel: 'Iniciar preparo →' },
  { key: 'preparando', label: '👨‍🍳 Preparando', next: 'saiu', nextLabel: 'Saiu p/ entrega →' },
  { key: 'saiu', label: '🛵 A caminho', next: 'entregue', nextLabel: 'Concluir →' },
  { key: 'entregue', label: '✅ Concluídos', next: null, nextLabel: '' },
  { key: 'cancelado', label: '🔴 Cancelados', next: null, nextLabel: '' }
];
function fmtMoney(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
function fmtTime(iso) { const d = new Date(iso); return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

function renderOrders() {
  const wrap = document.getElementById('view-pedidos');
  wrap.innerHTML = `<div class="order-cols">${COLS.map(col => {
    const list = orders.filter(o => o.status === col.key).slice(0, 30);
    return `
      <div>
        <div class="col-title"><span>${col.label}</span><span class="count">${list.length}</span></div>
        <div class="col-dropzone" data-status="${col.key}" ondragover="onColDragOver(event)" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event)">
          ${list.length === 0 ? '<div class="empty-col">Nenhum pedido</div>' : list.map(o => orderCardHTML(o, col)).join('')}
        </div>
      </div>`;
  }).join('')}</div>`;
}

// Drag and drop entre colunas do kanban — usa as mesmas funções advance()/cancelOrder() de sempre
function onCardDragStart(ev, id) {
  ev.dataTransfer.setData('text/plain', id);
  ev.target.classList.add('dragging');
}
function onCardDragEnd(ev) { ev.target.classList.remove('dragging'); }
function onColDragOver(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
function onColDragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }
function onColDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const id = ev.dataTransfer.getData('text/plain');
  const newStatus = ev.currentTarget.dataset.status;
  const order = orders.find(o => o.id === id);
  if (!order || order.status === newStatus || order.status === 'cancelado') return;
  if (newStatus === 'cancelado') { cancelOrder(id); return; }
  advance(id, newStatus);
}

function orderCardHTML(o, col) {
  const payLabels = { pix: 'PIX', credito: 'Crédito', debito: 'Débito', dinheiro: 'Dinheiro' };
  const isCancelled = o.status === 'cancelado';
  return `
    <div class="order-card ${o._isNew ? 'new' : ''} ${isCancelled ? 'cancelled' : ''}" ${isCancelled ? '' : `draggable="true" ondragstart="onCardDragStart(event,'${o.id}')" ondragend="onCardDragEnd(event)"`}>
      <div class="order-head">
        <div><div class="order-id">#${o.id}</div><div class="order-time">${fmtTime(o.createdAt)}</div></div>
        <div class="order-mode">${o.mode === 'delivery' ? '🛵 Delivery' : '🏪 Retirada'}</div>
      </div>
      ${isCancelled ? `<div class="cancel-warning">🔴 Cancelado — ${o.cancelReason || 'motivo não informado'}</div>` : ''}
      <div class="order-customer">👤 ${o.name} · 📞 ${o.phone}</div>
      <div class="order-addr">📍 ${o.address}</div>
      <div class="order-items">${o.items.map(i => `${i.qty}x ${i.name} <span>(${fmtMoney(i.price * i.qty)})</span>`).join('<br>')}</div>
      ${o.obs ? `<div class="order-obs">📝 ${o.obs}</div>` : ''}
      <div class="order-total"><span class="order-pay">${payLabels[o.payMethod] || o.payMethod}${o.troco ? ' (troco p/ ' + fmtMoney(o.troco) + ')' : ''}</span><span>${fmtMoney(o.total)}</span></div>
      <div class="order-actions">
        <details class="print-menu">
          <summary title="Imprimir vias">🖨️</summary>
          <div class="print-menu-list">
            <button onclick="printVia('${o.id}','cozinha')">🍳 Via Cozinha</button>
            <button onclick="printVia('${o.id}','sushibar')">🍣 Via Sushibar</button>
            <button onclick="printVia('${o.id}','bar')">🍹 Via Bar</button>
            <button onclick="printVia('${o.id}','caixa')">🧾 Via Caixa (completa)</button>
            <div class="div"></div>
            <button onclick="printAllVias('${o.id}')">🖨️ Imprimir todas as vias</button>
          </div>
        </details>
        ${col.next ? `<button class="btn-advance" onclick="advance('${o.id}','${col.next}')">${col.nextLabel}</button>` : ''}
        ${col.key !== 'entregue' && col.key !== 'cancelado' ? `<button class="btn-cancel" onclick="cancelOrder('${o.id}')">✕</button>` : ''}
      </div>
    </div>`;
}

async function printVia(orderId, station) {
  try {
    const r = await fetch('/api/print', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ orderId, station })
    });
    const data = await r.json();
    if (!r.ok) { toast(data.error || 'Erro ao imprimir.', true); return; }
    if (data.skipped) { toast(`Nenhum item da via "${station}" nesse pedido.`); return; }
    if (data.method === 'navegador') {
      const win = window.open('', '_blank', 'width=380,height=600');
      win.document.write(stationReceiptHTML(data.order, station));
      win.document.close();
      win.onload = () => { win.focus(); win.print(); };
    } else {
      toast(`✅ Impresso na impressora (${data.method}) — via ${station}.`);
    }
  } catch (e) { toast('Erro de conexão ao imprimir.', true); }
}

async function printAllVias(orderId) {
  for (const st of ['cozinha', 'sushibar', 'bar', 'caixa']) {
    await printVia(orderId, st);
    await new Promise(r => setTimeout(r, 350)); // evita bloqueio de pop-up do navegador
  }
}

async function advance(id, status) {
  const o = orders.find(x => x.id === id);
  let body = { status };
  // Ao aceitar o pedido (novo → preparando), permite ajustar a taxa de entrega antes de confirmar
  if (status === 'preparando' && o && o.mode === 'delivery') {
    const input = prompt(`Confirmar taxa de entrega para este pedido (R$):`, Number(o.fee || 0).toFixed(2));
    if (input === null) return; // cancelou
    const fee = parseFloat(input.replace(',', '.'));
    if (isNaN(fee) || fee < 0) { alert('Valor inválido.'); return; }
    body.fee = fee;
  }
  const r = await fetch('/api/orders/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
  const data = await r.json();
  if (o && data.order) { Object.assign(o, data.order); o._isNew = false; }
  renderOrders();
}
let cancelTargetId = null;
function cancelOrder(id) {
  cancelTargetId = id;
  document.getElementById('cancel-order-id').textContent = id;
  document.getElementById('cancel-reason-text').value = '';
  const chipsWrap = document.getElementById('cancel-reason-chips');
  chipsWrap.innerHTML = (cfg.cancelReasons || []).map(r =>
    `<button type="button" style="background:var(--card);border:1px solid var(--border);color:var(--white);border-radius:14px;padding:6px 12px;font-size:11px;" onclick="document.getElementById('cancel-reason-text').value='${r.replace(/'/g, "\\'")}'">${r}</button>`
  ).join('');
  document.getElementById('cancel-modal-backdrop').style.display = 'flex';
}
function closeCancelModal() { document.getElementById('cancel-modal-backdrop').style.display = 'none'; cancelTargetId = null; }
async function confirmCancelOrder() {
  const reason = document.getElementById('cancel-reason-text').value.trim() || 'Não informado';
  if (!cancelTargetId) return;
  await fetch('/api/orders/' + cancelTargetId, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ status: 'cancelado', cancelReason: reason })
  });
  const o = orders.find(x => x.id === cancelTargetId);
  if (o) { o.status = 'cancelado'; o.cancelReason = reason; }
  closeCancelModal();
  renderOrders();
  toast('Pedido cancelado e motivo registrado.');
}

function logoPreviewStyle(c) {
  const size = c.logoSize || 40;
  const shape = c.logoShape || 'retangular';
  if (shape === 'redondo') return `height:${size}px;width:${size}px;border-radius:50%;object-fit:cover;`;
  if (shape === 'quadrado') return `height:${size}px;width:${size}px;border-radius:6px;object-fit:cover;`;
  return `height:${size}px;width:auto;max-width:${size * 3}px;border-radius:4px;object-fit:contain;`;
}
function updateLogoPreview() {
  const img = document.getElementById('logo-preview-img');
  if (!img) return;
  const shape = document.getElementById('cfg-logoshape').value;
  const size = parseInt(document.getElementById('cfg-logosize').value) || 40;
  img.style.cssText = logoPreviewStyle({ logoShape: shape, logoSize: size });
}

function drawBarChart(elId, byDay) {
  const el = document.getElementById(elId);
  if (!byDay.length) { el.innerHTML = '<div class="empty-state"><div class="ic">📈</div><div class="msg">Sem dados no período</div></div>'; return; }
  const data = byDay.slice(-14);
  const max = Math.max(...data.map(x => x.orders), 1);
  const w = 500, h = 180, bw = w / data.length;
  const bars = data.map((x, i) => {
    const bh = (x.orders / max) * (h - 30);
    return `<rect x="${i * bw + bw * 0.2}" y="${h - bh - 20}" width="${bw * 0.6}" height="${bh}" rx="3" fill="var(--gold)" opacity="0.85"><title>${x.date.split('-').reverse().join('/')}: ${x.orders} pedido(s) · ${fmtMoney(x.revenue)}</title></rect>
    <text x="${i * bw + bw / 2}" y="${h - 4}" font-size="8" fill="var(--muted-dim)" text-anchor="middle">${x.date.slice(8, 10)}/${x.date.slice(5, 7)}</text>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${bars}</svg>`;
}

function drawPieChart(elId, byPay) {
  const el = document.getElementById(elId);
  const labels = { pix: 'PIX', credito: 'Crédito', debito: 'Débito', dinheiro: 'Dinheiro' };
  const colors = { pix: '#32C36C', credito: '#D4AF37', debito: '#3498db', dinheiro: '#e0344f' };
  const entries = Object.entries(byPay).filter(([, v]) => v > 0);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  if (!total) { el.innerHTML = '<div class="empty-state"><div class="ic">🥧</div><div class="msg">Sem dados no período</div></div>'; return; }
  let angle = 0;
  const r = 60, cx = 70, cy = 70;
  const slices = entries.map(([k, v]) => {
    const frac = v / total;
    const start = angle, end = angle + frac * 360;
    angle = end;
    const large = (end - start) > 180 ? 1 : 0;
    const x1 = cx + r * Math.cos(Math.PI * (start - 90) / 180), y1 = cy + r * Math.sin(Math.PI * (start - 90) / 180);
    const x2 = cx + r * Math.cos(Math.PI * (end - 90) / 180), y2 = cy + r * Math.sin(Math.PI * (end - 90) / 180);
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${colors[k] || '#888'}"><title>${labels[k] || k}: ${fmtMoney(v)}</title></path>`;
  }).join('');
  const legend = entries.map(([k, v]) => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:6px;"><span style="width:9px;height:9px;border-radius:2px;background:${colors[k] || '#888'};display:inline-block;"></span>${labels[k] || k} · ${fmtMoney(v)}</div>`).join('');
  el.innerHTML = `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><svg viewBox="0 0 140 140" style="width:130px;height:130px;flex:0 0 auto;">${slices}</svg><div>${legend}</div></div>`;
}

        <div class="admin-field"><label>De</label><input type="date" id="rep-from" value="${daysAgoISO(30)}"/></div>
        <div class="admin-field"><label>Até</label><input type="date" id="rep-to" value="${todayISO()}"/></div>
        <div class="admin-field" style="max-width:140px;display:flex;align-items:flex-end;"><button class="btn-save" style="margin:0;padding:10px;" onclick="loadReports()">Filtrar</button></div>
      </div>
      <div id="rep-content"></div>
      <p class="admin-sec-title">🗑 Excluir pedidos antigos</p>
      <div class="danger-box">
        <p class="hint" style="margin-top:0;">Apaga permanentemente do histórico todos os pedidos criados antes da data escolhida. Essa ação não pode ser desfeita e exige a senha master.</p>
        <div class="admin-row" style="margin-top:10px;">
          <div class="admin-field"><label>Excluir pedidos antes de</label><input type="date" id="purge-before" value="${daysAgoISO(90)}"/></div>
          <div class="admin-field"><label>Senha master</label><input type="password" id="purge-pass"/></div>
          <div class="admin-field" style="max-width:140px;display:flex;align-items:flex-end;"><button class="btn-danger" onclick="purgeOrders()">Excluir</button></div>
        </div>
      </div>`;
  }
  const from = document.getElementById('rep-from').value;
  const to = document.getElementById('rep-to').value;
  const r = await fetch(`/api/reports?from=${from}&to=${to}`, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) return logout();
  const d = await r.json();
  const payLabels = { pix: 'PIX', credito: 'Crédito', debito: 'Débito', dinheiro: 'Dinheiro' };
  document.getElementById('rep-content').innerHTML = `
    <div class="report-cards">
      <div class="report-card"><div class="value">${d.totalOrders}</div><div class="label">Pedidos</div></div>
      <div class="report-card"><div class="value">${fmtMoney(d.totalRevenue)}</div><div class="label">Faturamento</div></div>
      <div class="report-card"><div class="value">${fmtMoney(d.avgTicket)}</div><div class="label">Ticket médio</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div>
        <p style="font-size:11px;color:var(--red-lt);letter-spacing:1px;margin-bottom:8px;">MAIS VENDIDOS</p>
        <table class="report-table"><tr><th>Item</th><th>Qtd</th><th>Receita</th></tr>
          ${d.topItems.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>${fmtMoney(i.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty-col">Sem dados no período</td></tr>'}
        </table>
      </div>
      <div>
        <p style="font-size:11px;color:var(--red-lt);letter-spacing:1px;margin-bottom:8px;">POR PAGAMENTO</p>
        <table class="report-table"><tr><th>Forma</th><th>Total</th></tr>
          ${Object.entries(d.byPayMethod).map(([k, v]) => `<tr><td>${payLabels[k] || k}</td><td>${fmtMoney(v)}</td></tr>`).join('') || '<tr><td colspan="2" class="empty-col">Sem dados no período</td></tr>'}
        </table>
        <p style="font-size:11px;color:var(--red-lt);letter-spacing:1px;margin:16px 0 8px;">POR DIA</p>
        <table class="report-table"><tr><th>Data</th><th>Pedidos</th><th>Receita</th></tr>
          ${d.byDay.map(x => `<tr><td>${x.date.split('-').reverse().join('/')}</td><td>${x.orders}</td><td>${fmtMoney(x.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty-col">Sem dados no período</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function purgeOrders() {
  const beforeDate = document.getElementById('purge-before').value;
  const masterPass = document.getElementById('purge-pass').value;
  if (!beforeDate || !masterPass) { alert('Preencha a data e a senha master.'); return; }
  if (!confirm(`Tem certeza? Todos os pedidos antes de ${beforeDate.split('-').reverse().join('/')} serão apagados permanentemente.`)) return;
  const r = await fetch('/api/orders/purge', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ beforeDate, masterPass })
  });
  const data = await r.json();
  if (r.ok) { alert(`✅ ${data.deleted} pedido(s) apagado(s).`); document.getElementById('purge-pass').value = ''; loadOrders().then(renderOrders); loadReports(); }
  else alert(data.error || 'Erro ao excluir pedidos.');
}

if (token) boot();
</script>
</body>
</html>
